abstract: 'Open access dataset for hybrid brain-computer interfaces using EEG and NIRS. Includes two experiments: (1) left
  vs right hand motor imagery, (2) mental arithmetic vs resting state. Dataset validated using baseline signal analysis showing
  hybrid approach enhances discrimination of mental states. Also includes motion artifacts and physiological data for wide
  range of validation approaches.'
