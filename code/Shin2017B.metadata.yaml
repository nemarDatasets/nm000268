  instructions: For the MA task, subjects memorized an initial subtraction (three-digit minus one-digit) displayed for 2s,
    then repeatedly subtracted the one-digit number from each result. For baseline, subjects rested with no specific thought.
  mode: offline
  n_classes: 2
  paradigm: imagery
  primary_modality: visual
  stimulus_modalities:
  - visual
  - auditory
  stimulus_type: visual instruction (subtraction problem and fixation cross)
  study_design: 'Dataset B: mental arithmetic (serial subtraction of one-digit number) versus baseline/rest task'
  synchronicity: cued-synchronous
  trial_duration: 10.0
  trials_per_class:
    rest: 30
    subtraction: 30
file_format: MATLAB
methodology: 'Thirty subjects performed 6 sessions alternating between motor imagery (dataset A: left/right hand) and mental
  arithmetic (dataset B: MA vs rest). Each session: 20 trials with 2s cue, 10s task, 15-17s rest. EEG recorded at 1000 Hz
  with 30 channels, downsampled to 200 Hz. Preprocessing: CAR, 0.5-50 Hz bandpass (4th order Chebyshev II), ICA-based EOG
  rejection. Feature extraction: CSP with log-variance of first/last 3 components using 3s moving window (1s step). Classification:
  shrinkage LDA with 10x5-fold CV. Hybrid analysis combines EEG and NIRS outputs using meta-classifier.'
